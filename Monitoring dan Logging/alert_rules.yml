groups:
  - name: model-alerts
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(ml_model_request_latency_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "95th percentile latency is above 1 second for the model exporter."

      - alert: ModelErrorRate
        expr: rate(ml_model_request_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Model request errors detected"
          description: "There are errors in model request handling."

      - alert: HighActiveRequests
        expr: ml_model_active_requests > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of active requests"
          description: "The model exporter has more than 5 active requests."
