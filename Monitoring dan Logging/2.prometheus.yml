global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:5800']

  - job_name: 'model_exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['exporter:5880']
