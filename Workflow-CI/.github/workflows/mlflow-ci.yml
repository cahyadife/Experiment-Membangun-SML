name: MLflow CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install --upgrade pip mlflow scikit-learn pandas matplotlib requests

      - name: Run MLflow Project
        working-directory: MLProject
        run: mlflow run . --no-conda -P data_path=namadataset_preprocessing/indonesia_gdp_preprocessed.csv

      - name: Upload MLflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artefacts
          path: mlruns

  docker-build:
    needs: train-model
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/eksperimen_sml:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install MLflow
        run: python -m pip install --upgrade pip mlflow

      - name: Log in to Docker Hub
        uses: docker/login-action@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from MLflow Project
        working-directory: MLProject
        run: mlflow build-docker -m MLproject -n ${{ env.DOCKER_IMAGE }}

      - name: Push Docker image to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE }}
