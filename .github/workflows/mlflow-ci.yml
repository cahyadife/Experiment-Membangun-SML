name: MLflow CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install --upgrade pip mlflow==2.19.0 scikit-learn pandas matplotlib requests

      - name: Run MLflow Project
        working-directory: Workflow-CI/MLProject
        run: mlflow run . --env-manager=local -P data_path=namadataset_preprocessing/indonesia_gdp_preprocessed.csv

      - name: Upload MLflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artefacts
          path: Workflow-CI/MLProject/mlruns

  docker-build:
    needs: train-model
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/eksperimen_sml:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install --upgrade pip mlflow==2.19.0 scikit-learn pandas matplotlib requests

      - name: Download MLflow artefacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artefacts
          path: Workflow-CI/MLProject/mlruns

      - name: Resolve Model URI
        working-directory: Workflow-CI/MLProject
        run: |
          MODEL_PATH=$(python -c "import mlflow; mlflow.set_tracking_uri('file:mlruns'); print(mlflow.search_runs(experiment_names=['Analisa_Ekonomi_Indonesia']).iloc[0]['artifact_uri'] + '/model')")
          echo "MODEL_URI=$MODEL_PATH" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from MLflow model
        run: mlflow models build-docker -m "${{ env.MODEL_URI }}" -n "${{ env.DOCKER_IMAGE }}" --env-manager=local

      - name: Push Docker image to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE }}
